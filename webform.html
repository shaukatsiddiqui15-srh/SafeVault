<!-- webform.html -->
<form action="/submit" method="post" novalidate>
    <label for="username">Username:</label>
    <input
        type="text"
        id="username"
        name="username"
        minlength="3"
        maxlength="50"
        pattern="[A-Za-z0-9._-]+"
        autocomplete="username"
        required>

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        maxlength="254"
        autocomplete="email"
        required>

    <button type="submit">Submit</button>
</form>
